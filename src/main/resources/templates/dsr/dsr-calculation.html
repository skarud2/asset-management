<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/basic2 :: layout(~{::title}, ~{::main}, ~{::script}, ${serviceName})}">
<head>
    <meta charset="UTF-8">
    <title>DSR 계산기</title>
    <link rel="stylesheet"
          th:href="@{/css/dsr-calculation.css}">
</head>

<main class="dsr">
    <section class="wrap">

        <h1 class="title">DSR 계산기</h1>

        <div class="line"></div>
        <p class="description">
            소득과 대출 정보를 입력하면 예상 DSR을 계산할 수 있습니다.
        </p>

        <div class="box">

            <form class="form"
                  th:action="@{/dsr}"
                  th:object="${dsrCalculationRequest}"
                  method="post">

                <div>
                    <label for="annualIncome">연소득</label>
                    <input type="number"
                           id="annualIncome"
                           th:field="*{annualIncome}"
                           required
                           min="10000"
                           step="10000"
                           placeholder="예: 50000000">
                </div>

                <div>
                    <label for="loanType">대출 종류</label>
                    <select id="loanType" th:field="*{loanType}" required>
                        <option value="">선택</option>
                        <option value="MORTGAGE_LOAN">주택담보대출</option>
                        <option value="CREDIT_LOAN">신용대출</option>
                        <option value="JEONSE_LOAN">전세자금대출</option>
                    </select>
                </div>

                <div>
                    <label for="requestAmount">희망 대출 금액</label>
                    <input type="number"
                           id="requestAmount"
                           th:field="*{requestAmount}"
                           min="10000"
                           step="10000"
                           required
                           placeholder="예: 100000000">
                </div>

                <div>
                    <label for="expectedInterestRate">예상 금리(%)</label>
                    <input type="number"
                           id="expectedInterestRate"
                           th:field="*{expectedInterestRate}"
                           min="0.01"
                           step="0.01"
                           required
                           placeholder="예: 4.5">
                </div>

                <div>
                    <label for="loanTermYears">대출 기간(년)</label>
                    <input type="number"
                           id="loanTermYears"
                           th:field="*{loanTermYears}"
                           min="1"
                           required
                           placeholder="예: 30">
                </div>

                <div>
                    <label for="repaymentType">상환 방식</label>
                    <select id="repaymentType" required
                            th:field="*{repaymentType}">
                        <option value="">선택</option>
                        <option value="EQUAL_PRINCIPAL_INTEREST">
                            원리금균등
                        </option>
                        <option value="EQUAL_PRINCIPAL">
                            원금균등
                        </option>
                        <option value="GRACE_PERIOD">
                            거치식
                        </option>
                        <option value="BULLET_PAYMENT">
                            만기일시상환
                        </option>
                    </select>
                </div>

                <!-- 주택담보대출 입력 -->
                <section id="mortgageFields" class="conditional-section" hidden>
                    <h2>주택담보대출 정보</h2>

                    <div>
                        <label for="propertyRegion">주택 지역</label>
                        <select id="propertyRegion"
                                th:field="*{propertyRegion}">
                            <option value="">선택</option>
                            <option value="CAPITAL_AREA">수도권</option>
                            <option value="REGULATED_AREA">규제지역</option>
                            <option value="OTHER">그 외 지역</option>
                        </select>
                    </div>
                </section>

                <!-- 주담대·신용대출 금리 유형 -->
                <section id="interestRateFields" class="conditional-section" hidden>
                    <div>
                        <label for="interestRateType">금리 유형</label>
                        <select id="interestRateType"
                                th:field="*{interestRateType}">
                            <option value="">선택</option>
                            <option value="FIXED">고정금리</option>
                            <option value="VARIABLE">변동금리</option>
                        </select>
                    </div>
                </section>

                <!-- 전세대출 입력 -->
                <section id="jeonseFields" class="conditional-section" hidden>
                    <h2>전세자금대출 정보</h2>

                    <div>
                        <label for="housingOwnershipType">주택 보유 수</label>
                        <select id="housingOwnershipType"
                                th:field="*{housingOwnershipType}">
                            <option value="">선택</option>
                            <option value="NO_HOUSE">무주택</option>
                            <option value="ONE_HOUSE">1주택</option>
                            <option value="MULTIPLE_HOUSES">
                                2주택 이상
                            </option>
                        </select>
                    </div>

                    <div>
                        <label for="rentalPropertyRegion">
                            임차주택 지역
                        </label>
                        <select id="rentalPropertyRegion"
                                th:field="*{rentalPropertyRegion}">
                            <option value="">선택</option>
                            <option value="CAPITAL_OR_REGULATED">
                                수도권 또는 규제지역
                            </option>
                            <option value="OTHER">그 외 지역</option>
                        </select>
                    </div>
                </section>

                <button class="submit-button" type="submit">DSR 계산하기</button>
            </form>
        </div>


        <section class="result-section" th:if="${result}">
            <h2 class="result-title">계산 결과</h2>

            <div class="result-card">
                <span>신규 대출 단독 예상 DSR</span>
                <strong th:text="|${result.dsrRate}%|"></strong>
            </div>

            <div class="result-card">
                <span>신규 대출 단독 예상 스트레스 DSR</span>
                <strong th:text="|${result.stressDsrRate}%|"></strong>
            </div>

            <p class="result-notice">
                기존 보유 대출을 제외하고 입력한 신규 대출만을 기준으로 계산한 결과입니다.
            </p>

            <dl class="result-detail">
                <dt>적용 연소득</dt>
                <dd th:text="|${#numbers.formatInteger(result.annualIncome, 0, 'COMMA')}원|">
                </dd>

                <dt>신규 대출 연간 원리금</dt>
                <dd th:text="|${#numbers.formatInteger(result.newLoanAnnualDebtPayment, 0, 'COMMA')}원|">
                </dd>

                <dt>스트레스 적용 신규 대출 연간 원리금</dt>
                <dd th:text="|${#numbers.formatInteger(result.stressNewLoanAnnualDebtPayment, 0, 'COMMA')}원|">
                </dd>
            </dl>
        </section>

        <script th:src="@{/js/dsr-calculation.js}"></script>

    </section>
</main>
</html>
