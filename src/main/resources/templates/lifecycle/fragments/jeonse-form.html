<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="jeonseForm">

    <section class="lifecycle-event-detail">

        <div class="lifecycle-event-detail-header">

            <div>
                <span>전세</span>
                <h3>전세 계획을 알려주세요.</h3>
            </div>

            <p>
                희망 전세금과 자기자금, 대출계획을 기준으로
                필요한 자금과 금융상품을 분석합니다.
            </p>

        </div>


        <form id="jeonseSurveyForm"
              class="lifecycle-form">

            <div class="lifecycle-form-group">

                <label for="jeonseTargetDate">
                    전세 입주 희망 시기
                </label>

                <input type="month"
                       id="jeonseTargetDate"
                       name="targetDate"
                       required>

            </div>


            <div class="lifecycle-form-group">

                <label for="jeonseRegionSido">
                    희망 지역 시·도
                </label>

                <select id="jeonseRegionSido"
                        name="regionSido"
                        data-region-sido
                        data-region-target="jeonseRegionSigungu"
                        required>
                    <option value="">시·도를 선택해주세요</option>
                </select>

            </div>


            <div class="lifecycle-form-group">

                <label for="jeonseRegionSigungu">
                    희망 지역 시·군·구
                </label>

                <select id="jeonseRegionSigungu"
                        name="regionSigungu"
                        data-region-sigungu
                        required
                        disabled>
                    <option value="">먼저 시·도를 선택해주세요</option>
                </select>

            </div>


            <div class="lifecycle-form-group">

                <label for="jeonseHousingType">
                    희망 주택 유형
                </label>

                <select id="jeonseHousingType"
                        name="housingType"
                        required>

                    <option value="">선택해주세요</option>
                    <option th:each="type : ${housingTypes}"
                            th:value="${type.name()}"
                            th:text="${type.label}"></option>

                </select>

            </div>


            <div class="lifecycle-form-group">

                <label for="jeonseDesiredArea">
                    희망 전용면적
                </label>

                <div class="lifecycle-input-unit">

                    <input type="number"
                           id="jeonseDesiredArea"
                           name="desiredArea"
                           min="0"
                           step="0.1">

                    <span>㎡</span>

                </div>

            </div>


            <div class="lifecycle-form-group">

                <span class="lifecycle-form-label">
                    주거 수준
                </span>

                <div class="lifecycle-radio-group">
                    <th:block th:replace="~{lifecycle/fragments/lifestyle-options :: options('jeonseLifestyleLevel', false)}"></th:block>
                </div>

            </div>


            <div class="lifecycle-form-group">

                <label for="jeonseDesiredAmount">
                    희망 전세보증금
                </label>

                <div class="lifecycle-input-unit">

                    <input type="number"
                           id="jeonseDesiredAmount"
                           name="desiredJeonseAmount"
                           min="0">

                    <span>원</span>

                </div>

            </div>


            <div class="lifecycle-form-group">

                <label for="jeonseOwnFundAmount">
                    사용할 자기자금
                </label>

                <div class="lifecycle-input-unit">

                    <input type="number"
                           id="jeonseOwnFundAmount"
                           name="ownFundAmount"
                           min="0">

                    <span>원</span>

                </div>

            </div>


            <div class="lifecycle-form-group">

                <label for="jeonseDesiredLoanAmount">
                    희망 전세대출금액
                </label>

                <div class="lifecycle-input-unit">

                    <input type="number"
                           id="jeonseDesiredLoanAmount"
                           name="desiredLoanAmount"
                           min="0"
                           value="0"
                           readonly>

                    <span>원</span>

                </div>

                <small>희망 전세보증금에서 자기자금을 뺀 금액이 자동으로 계산됩니다.</small>

            </div>


            <div class="lifecycle-form-actions">

                <button type="button"
                        id="saveJeonseSurveyBtn"
                        class="lifecycle-primary-button">

                    전세 계획 저장

                </button>

            </div>

        </form>

    </section>

</th:block>

</html>
