<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="vehicleForm">

    <section class="lifecycle-event-detail">

        <div class="lifecycle-event-detail-header">
            <div>
                <span>차량 구매</span>
                <h3>차량 구매 계획을 알려주세요.</h3>
            </div>
            <p>
                구매 가격과 자기자금, 대출 및 유지비를 기준으로
                미래 현금흐름 변화를 분석합니다.
            </p>
        </div>

        <form id="vehicleSurveyForm"
              class="lifecycle-form">

            <div class="lifecycle-form-group">
                <label for="vehicleTargetDate">차량 구매 예정 시기</label>
                <input type="month"
                       id="vehicleTargetDate"
                       name="targetDate"
                       required>
            </div>

            <div class="lifecycle-form-group">
                <label for="vehicleModel">대표 차종</label>
                <select id="vehicleModel" name="vehicleModel" required>
                    <option value="">차종을 선택해 주세요</option>
                    <option value="RAY">기아 레이</option>
                    <option value="K3">기아 K3</option>
                    <option value="AVANTE">현대 아반떼</option>
                    <option value="G70">제네시스 G70</option>
                    <option value="G80">제네시스 G80</option>
                    <option value="G90">제네시스 G90</option>
                    <option value="GV60">제네시스 GV60</option>
                    <option value="GV70">제네시스 GV70</option>
                    <option value="GV80">제네시스 GV80</option>
                </select>
                <input type="hidden" id="vehicleName" name="vehicleName">

                <label for="vehicleCondition">차량 상태</label>
                <select id="vehicleCondition" name="vehicleCondition" required>
                    <option value="NEW">신차</option>
                    <option value="USED">중고차</option>
                </select>

                <label for="vehicleAnnualMileageKm">연간 예상 주행거리</label>
                <input type="number" id="vehicleAnnualMileageKm" name="annualMileageKm"
                       min="1000" max="100000" step="1000" value="12000" required>
            </div>

            <div class="lifecycle-form-group">
                <label for="vehiclePrice">차량 가격</label>
                <div class="lifecycle-input-unit">
                    <input type="number"
                           id="vehiclePrice"
                           name="vehiclePrice"
                           min="0"
                           placeholder="차종 선택 시 자동 입력"
                           readonly
                       >
                    <span>원</span>
                </div>
            </div>

            <div class="lifecycle-form-group">
                <label for="vehicleLoanAmount">할부·대출 예정 금액</label>
                <div class="lifecycle-input-unit">
                    <input type="number"
                           id="vehicleLoanAmount"
                           name="loanAmount"
                           min="0"
                           value="0"
                           required>
                    <span>원</span>
                </div>
                <small>할부나 대출을 이용하지 않으면 0원으로 두세요.</small>
            </div>

            <div class="lifecycle-form-group">
                <label for="vehicleCashPaymentAmount">자기자금</label>
                <div class="lifecycle-input-unit">
                    <input type="number"
                           id="vehicleCashPaymentAmount"
                           name="cashPaymentAmount"
                           min="0"
                           value="0"
                           readonly
                           required>
                    <span>원</span>
                </div>
                <small>차량 가격에서 할부·대출 예정 금액을 뺀 금액으로 자동 계산됩니다.</small>
            </div>

            <div class="lifecycle-form-group" id="vehicleLoanPeriodGroup" hidden>
                <label for="vehicleLoanPeriodMonths">대출 기간</label>
                <select id="vehicleLoanPeriodMonths"
                        name="loanPeriodMonths">
                    <option value="">대출을 이용할 경우 선택해주세요</option>
                    <option value="12">12개월</option>
                    <option value="24">24개월</option>
                    <option value="36">36개월</option>
                    <option value="48">48개월</option>
                    <option value="60">60개월</option>
                </select>
                <small>차량 금융상품의 일반적인 원리금균등상환 기간입니다.</small>
            </div>

            <div class="lifecycle-form-group">
                <label for="vehicleMonthlyMaintenanceCost">월 예상 유지비</label>
                <div class="lifecycle-input-unit">
                    <input type="number"
                           id="vehicleMonthlyMaintenanceCost"
                           name="monthlyMaintenanceCost"
                           data-optional="true"
                           min="0"
                           placeholder="예: 300000">
                    <span>원</span>
                </div>
                <small>선택한 차종·신차/중고 기준으로 기본 유지비가 계산됩니다. 직접 입력하지 않아도 됩니다.</small>
            </div>

            <div class="lifecycle-form-actions">
                <button type="button"
                        id="saveVehicleSurveyBtn"
                        class="lifecycle-primary-button">
                    차량 구매 계획 저장
                </button>
            </div>

        </form>

    </section>

</th:block>

</html>
