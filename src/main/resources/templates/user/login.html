<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/basic2 :: layout(~{::title}, ~{::main},~{::script}, ${serviceName})}">

<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<main class="login">
    <section class="wrap">
        <div class="title">로그인</div>
        <div class="line"></div>

        <p class="msg error"
           th:if="${param.error}">
            이메일 또는 비밀번호가 일치하지 않습니다.
        </p>

        <p class="msg"
           th:if="${param.logout}">
            로그아웃되었습니다.
        </p>

        <p class="msg"
           th:if="${signupMessage}"
           th:text="${signupMessage}">
        </p>

        <p class="msg"
           th:if="${param.signup}">
            회원가입이 완료되었습니다.
        </p>

        <div class="box">
            <form class="form"
                  th:action="@{/login}"
                  method="post">

                <div class="field">
                    <label for="loginEmail">이메일</label>

                    <input type="email"
                           id="loginEmail"
                           name="loginEmail"
                           placeholder="이메일을 입력해주세요"
                           autocomplete="email"
                           required>
                </div>

                <div class="field">
                    <label for="password">비밀번호</label>

                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="비밀번호를 입력해주세요"
                           autocomplete="current-password"
                           required>
                </div>

                <button type="submit" class="btn">
                    로그인
                </button>
            </form>

            <div class="links">
                <a th:href="@{/find/id}">아이디 찾기</a>
                <span>|</span>
                <a th:href="@{/find/pw}">비밀번호 찾기</a>
                <span>|</span>
                <a th:href="@{/signup/email}">회원가입</a>
            </div>

            <div class="or">
                <span>또는</span>
            </div>

            <a class="kakao" th:href="@{/oauth2/authorization/kakao}">
                <img th:src="@{/images/kakao_login.png}" alt="카카오로 시작하기">
            </a>
        </div>

        <div id="resetSuccess"
             th:if="${param.reset}"
             hidden>
        </div>

    </section>
</main>
<script defer th:src="@{/js/login.js}"></script>
</body>
</html>
