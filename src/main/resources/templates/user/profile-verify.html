<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/basic2 :: layout(
          ~{::title},
          ~{::main},
          ~{::script},
          ${serviceName}
      )}">

<head>
  <title>내 프로필 관리</title>
</head>

<body>

<main class="profile-page">

  <section class="profile-wrap verify-wrap">

    <div class="profile-head">
      <h1>내 프로필 관리</h1>
      <p>회원 정보 보호를 위해 비밀번호를 확인해주세요.</p>
    </div>

    <div class="profile-card">

      <form th:action="@{/profile/verify}"
            method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="field">
          <label for="password">비밀번호</label>

          <input type="password"
                 id="password"
                 name="password"
                 autocomplete="current-password"
                 required>
        </div>

        <p class="error"
           th:if="${passwordError}"
           th:text="${passwordError}">
        </p>

        <button type="submit"
                class="black-btn">
          확인
        </button>

      </form>

    </div>

  </section>

</main>

<script></script>

</body>
</html>
