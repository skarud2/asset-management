<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/basic2 :: layout(~{::title}, ~{::main}, ~{::script}, ${serviceName})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>회원가입</title>

    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>

<body>

<main class="page">
    <section class="wrap">

        <h1 class="title">회원가입</h1>

        <div class="line"></div>

        <div class="box">
            <form id="signupForm"
                  class="form"
                  th:action="@{/signup}"
                  th:object="${userRequest}"
                  method="post">

                <div class="error all"
                     th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="error : ${#fields.globalErrors()}"
                       th:text="${error}">
                        회원가입에 실패했습니다.
                    </p>
                </div>

                <div class="field">
                    <label for="loginEmail">이메일</label>

                    <input type="email"
                           id="loginEmail"
                           th:field="*{loginEmail}"
                           readonly>
                </div>

                <div class="field">
                    <label for="userName">이름</label>

                    <input type="text"
                           id="userName"
                           th:field="*{userName}"
                           placeholder="이름을 입력해주세요"
                           autocomplete="name">

                    <p class="error"
                       th:if="${#fields.hasErrors('userName')}"
                       th:errors="*{userName}">
                        이름 오류
                    </p>
                </div>

                <div class="field">
                    <label for="password">비밀번호</label>

                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           placeholder="8~64자로 입력해주세요"
                           autocomplete="new-password">

                    <p class="error"
                       th:if="${#fields.hasErrors('password')}"
                       th:errors="*{password}">
                        비밀번호 오류
                    </p>
                </div>

                <div class="field">
                    <label for="passwordConfirm">비밀번호 확인</label>

                    <input type="password"
                           id="passwordConfirm"
                           placeholder="비밀번호를 다시 입력해주세요"
                           autocomplete="new-password">

                    <p id="passwordMessage"
                       class="error"></p>
                </div>

                <div class="field">
                    <label for="phoneNumber">휴대전화 번호</label>

                    <input type="tel"
                           id="phoneNumber"
                           th:field="*{phoneNumber}"
                           placeholder="- 제외"
                           maxlength="11"
                           inputmode="numeric"
                           autocomplete="tel"
                           required>

                    <p class="error"
                       th:if="${#fields.hasErrors('phoneNumber')}"
                       th:errors="*{phoneNumber}">
                        전화번호 오류
                    </p>
                </div>

                <div class="field">
                    <label for="birthDate">생년월일</label>

                    <input type="date"
                           id="birthDate"
                           th:field="*{birthDate}">

                    <p class="error"
                       th:if="${#fields.hasErrors('birthDate')}"
                       th:errors="*{birthDate}">
                        생년월일 오류
                    </p>
                </div>

                <button type="submit"
                        class="btn">
                    가입하기
                </button>

            </form>
        </div>

    </section>
</main>

<script th:src="@{/js/signup.js}"></script>
</body>
</html>
